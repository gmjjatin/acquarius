name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: dotnet test Backend.Tests/Backend.Tests.csproj --configuration Release
      - run: docker build --file Backend/Dockerfile --tag ticket-tracker-api .
      - run: docker build --file Dockerfile --tag ticket-tracker-frontend .
